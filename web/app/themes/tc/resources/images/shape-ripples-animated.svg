<!-- Bewegende versie van shape-ripples.svg voor de fotoheader "half" (components/page-hero): zodra de cirkels zijn
     ingevaagd (na 1,2 s) draaien ze kort een stukje (afwisselend met en tegen de klok in, vertragend) en blijven
     daarna stilstaan. Per cirkel een eigen @keyframes met vaste waarden (Safari kent geen var() in keyframes van een
     SVG als afbeelding). Gegenereerd uit shape-ripples.svg.
     Staat inline in de pagina (niet als <img>), zodat de gekleurde cirkel de rubriekskleur (--accent) volgt; daarom
     zijn de selectors, keyframes en id's voorzien van "hero-ripples"/"ripple-", anders botsen ze met de rest. -->
